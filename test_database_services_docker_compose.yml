services:
  postgresql:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: qkd_db
      POSTGRES_USER: qkd_user
      POSTGRES_PASSWORD: qkd_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qkd_user -d qkd_db"]
      interval: 2s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:latest
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: qkd_db
      MYSQL_USER: qkd_user
      MYSQL_PASSWORD: qkd_password
      MYSQL_ROOT_PASSWORD: root_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_password --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
  mariadb:
    image: mariadb:latest
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: qkd_db
      MARIADB_USER: qkd_user
      MARIADB_PASSWORD: qkd_password
      MARIADB_ROOT_PASSWORD: root_password
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -proot_password --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
